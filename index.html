<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#12100e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mantra Jaap Loop & Timer</title>
  <style>
    :root {
      --bg: #12100e;
      --card: #1c1916;
      --border: #2e2924;
      --text: #e8dfd5;
      --muted: #9c8f80;
      --accent: #e08a44;
      --accent-dim: rgba(224, 138, 68, 0.15);
      --danger: #d9534f;
      --success: #5cb85c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      user-select: none;
    }
    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
    h1 { font-size: 1.2rem; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
    .badge { font-size: 0.75rem; background: var(--card); border: 1px solid var(--border); padding: 4px 8px; border-radius: 99px; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .counter-wrap { display: flex; flex-direction: column; align-items: center; padding: 12px 0; position: relative; }
    .ring-svg { width: 180px; height: 180px; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }
    .ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 502.65; stroke-dashoffset: 502.65; transition: stroke-dashoffset 0.25s ease; }
    .ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .jaap-num { font-size: 2.6rem; font-weight: 800; line-height: 1; color: var(--text); }
    .jaap-sub { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-top: 12px; text-align: center; }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
    .stat-val { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .stat-lbl { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button, .file-label {
      flex: 1; min-width: 80px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-weight: 600; font-size: 0.88rem; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.15s;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #12100e; border-color: var(--accent); }
    .btn-danger { background: rgba(217, 83, 79, 0.18); color: #ff8a86; border-color: var(--danger); }
    .btn-active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .preset-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .preset-btn { padding: 8px 4px; font-size: 0.8rem; min-width: 0; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 0.72rem; color: var(--muted); }
    .field input {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 8px 10px; border-radius: 8px; font-size: 0.9rem; width: 100%;
    }
    .status-line { font-size: 0.78rem; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Mantra Jaap Studio</h1>
      <span id="wakeStatus" class="badge">Bg Engine Ready</span>
    </header>

    <!-- Counter & Mala Progress -->
    <div class="card">
      <div class="counter-wrap">
        <svg class="ring-svg" viewBox="0 0 180 180">
          <circle class="ring-bg" cx="90" cy="90" r="80"></circle>
          <circle id="ringFg" class="ring-fg" cx="90" cy="90" r="80"></circle>
        </svg>
        <div class="ring-center">
          <div id="sessionCount" class="jaap-num">0</div>
          <div id="beadProgress" class="jaap-sub">Bead 0 / 108</div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div id="malaCount" class="stat-val">0</div>
          <div class="stat-lbl">Malas (108x)</div>
        </div>
        <div class="stat-box">
          <div id="timerDisplay" class="stat-val">01:00:00</div>
          <div class="stat-lbl">Time Left</div>
        </div>
        <div class="stat-box">
          <div id="lifetimeCount" class="stat-val">0</div>
          <div class="stat-lbl">Lifetime Jaap</div>
        </div>
      </div>
    </div>

    <!-- Step 1: Record or Load Mantra -->
    <div class="card">
      <div class="section-title">1. Mantra Audio (Saved Offline)</div>
      <div class="btn-row">
        <button id="recBtn">🎙️ Record Mantra</button>
        <label class="file-label" for="audioUpload">📂 Upload File</label>
        <input type="file" id="audioUpload" accept="audio/*" />
      </div>
      <div class="status-line">
        <span id="clipStatus">No mantra recorded yet</span>
        <span id="clipDuration">0.0s</span>
      </div>
    </div>

    <!-- Step 2: Timer & Target Config -->
    <div class="card">
      <div class="section-title">2. Duration & Target</div>
      <div class="preset-row">
        <button class="preset-btn" data-mins="30">30m</button>
        <button class="preset-btn btn-active" data-mins="60">1 Hr</button>
        <button class="preset-btn" data-mins="120">2 Hr</button>
        <button class="preset-btn" data-mins="180">3 Hr</button>
      </div>
      <div class="input-row">
        <div class="field">
          <label for="customMins">Timer (Minutes, 0 = ∞)</label>
          <input type="number" id="customMins" value="60" min="0" max="1440" />
        </div>
        <div class="field">
          <label for="targetCount">Target Jaap (0 = ∞)</label>
          <input type="number" id="targetCount" value="0" min="0" step="108" placeholder="e.g. 108" />
        </div>
      </div>
    </div>

    <!-- Step 3: Playback Controls -->
    <div class="card">
      <div class="btn-row">
        <button id="startBtn" class="btn-primary">▶ Start Jaap</button>
        <button id="resetBtn">↺ Reset Session</button>
      </div>
    </div>
  </div>

  <!-- Hidden Native Loop Player for OS Background Continuity -->
  <audio id="mantraPlayer" loop playsinline></audio>

  <script>
    // --- 1. Single-File PWA Manifest & Service Worker Injection ---
    (function setupPWA() {
      const manifest = {
        name: "Mantra Jaap Counter",
        short_name: "MantraJaap",
        start_url: ".",
        display: "standalone",
        background_color: "#12100e",
        theme_color: "#12100e",
        icons: [{
          src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c1916'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='%23e08a44'>ॐ</text></svg>",
          sizes: "192x192",
          type: "image/svg+xml"
        }]
      };
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(link);
    })();

    // --- 2. IndexedDB Storage for Persistent Mantra Audio ---
    const DB_NAME = 'MantraJaapDB';
    const STORE_NAME = 'audioStore';
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function saveAudioBlob(blob) {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(blob, 'savedMantra');
    }
    async function loadAudioBlob() {
      const db = await openDB();
      return new Promise(resolve => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get('savedMantra');
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    }

    // --- 3. State & DOM Elements ---
    const player = document.getElementById('mantraPlayer');
    const recBtn = document.getElementById('recBtn');
    const audioUpload = document.getElementById('audioUpload');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const sessionCountEl = document.getElementById('sessionCount');
    const malaCountEl = document.getElementById('malaCount');
    const beadProgressEl = document.getElementById('beadProgress');
    const lifetimeCountEl = document.getElementById('lifetimeCount');
    const timerDisplayEl = document.getElementById('timerDisplay');
    const clipStatusEl = document.getElementById('clipStatus');
    const clipDurationEl = document.getElementById('clipDuration');
    const customMinsInput = document.getElementById('customMins');
    const targetCountInput = document.getElementById('targetCount');
    const ringFg = document.getElementById('ringFg');
    const wakeStatus = document.getElementById('wakeStatus');

    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let isPlaying = false;
    let sessionCount = Number(localStorage.getItem('mj_session') || 0);
    let lifetimeCount = Number(localStorage.getItem('mj_lifetime') || 0);
    let endTimeMs = null;
    let remainingSec = 3600;
    let timerInterval = null;
    let lastAudioTime = 0;
    let wakeLock = null;
    const RING_CIRCUMFERENCE = 2 * Math.PI * 80;

    // --- 4. UI & Counter Updates ---
    function formatHMS(sec) {
      if (sec <= 0) return "00:00:00";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    function updateCounterUI() {
      sessionCountEl.textContent = sessionCount;
      lifetimeCountEl.textContent = lifetimeCount;
      const malas = Math.floor(sessionCount / 108);
      const bead = sessionCount % 108;
      malaCountEl.textContent = malas;
      beadProgressEl.textContent = `Bead ${bead} / 108`;
      const offset = RING_CIRCUMFERENCE - (bead / 108) * RING_CIRCUMFERENCE;
      ringFg.style.strokeDashoffset = offset;
      updateMediaSessionMeta();
    }

    function incrementJaap() {
      sessionCount++;
      lifetimeCount++;
      localStorage.setItem('mj_session', sessionCount);
      localStorage.setItem('mj_lifetime', lifetimeCount);
      updateCounterUI();

      const target = Number(targetCountInput.value);
      if (target > 0 && sessionCount >= target) {
        stopPlayback(true);
      }
    }

    // --- 5. Background Loop Detection & MediaSession ---
    // Using native <audio loop> prevents Android/iOS from suspending playback between iterations.
    // Whenever the loop wraps back to 0, 'seeking'/'timeupdate' detects the wrap-around reliably.
    player.addEventListener('timeupdate', () => {
      if (!isPlaying) return;
      const cur = player.currentTime;
      const dur = player.duration || 1;
      if (cur < lastAudioTime && lastAudioTime > dur * 0.65) {
        incrementJaap();
      }
      lastAudioTime = cur;
    });

    function updateMediaSessionMeta() {
      if ('mediaSession' in navigator) {
        const malas = Math.floor(sessionCount / 108);
        navigator.mediaSession.metadata = new MediaMetadata({
          title: `Jaap: ${sessionCount} (Mala: ${malas})`,
          artist: `Time Left: ${formatHMS(remainingSec)}`,
          album: 'Mantra Jaap Studio'
        });
      }
    }

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => { if (!isPlaying) startPlayback(); });
      navigator.mediaSession.setActionHandler('pause', () => { if (isPlaying) stopPlayback(false); });
      navigator.mediaSession.setActionHandler('stop', () => stopPlayback(false));
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeStatus.textContent = 'WakeLock + Bg Active';
        } catch (err) {
          wakeStatus.textContent = 'Bg Audio Active';
        }
      }
    }

    // --- 6. Recording & Loading Audio ---
    async function attachAudioBlob(blob, label = 'Saved Mantra Ready') {
      const url = URL.createObjectURL(blob);
      player.src = url;
      clipStatusEl.textContent = label;
      player.onloadedmetadata = () => {
        if (isFinite(player.duration)) {
          clipDurationEl.textContent = `${player.duration.toFixed(1)}s`;
        }
      };
    }

    recBtn.addEventListener('click', async () => {
      if (isPlaying) stopPlayback(false);
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
          mediaRecorder.onstop = async () => {
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            await saveAudioBlob(blob);
            await attachAudioBlob(blob, 'Voice Mantra Saved');
            stream.getTracks().forEach(t => t.stop());
          };
          mediaRecorder.start();
          isRecording = true;
          recBtn.textContent = '⏹ Stop Recording';
          recBtn.classList.add('btn-danger');
          clipStatusEl.textContent = 'Recording mantra... chant now';
        } catch (err) {
          alert('Microphone permission is required to record your mantra.');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.textContent = '🎙️ Record Mantra';
        recBtn.classList.remove('btn-danger');
      }
    });

    audioUpload.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await saveAudioBlob(file);
      await attachAudioBlob(file, `Loaded: ${file.name.slice(0, 18)}`);
    });

    // --- 7. Timer & Playback Engine ---
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('btn-active'));
        btn.classList.add('btn-active');
        customMinsInput.value = btn.dataset.mins;
        if (!isPlaying) {
          remainingSec = Number(btn.dataset.mins) * 60;
          timerDisplayEl.textContent = formatHMS(remainingSec);
        }
      });
    });

    customMinsInput.addEventListener('input', () => {
      if (!isPlaying) {
        remainingSec = Number(customMinsInput.value) * 60;
        timerDisplayEl.textContent = remainingSec > 0 ? formatHMS(remainingSec) : '∞';
      }
    });

    async function startPlayback() {
      if (!player.src) {
        alert('Please record or upload a mantra first.');
        return;
      }
      const mins = Number(customMinsInput.value);
      if (remainingSec <= 0 && mins > 0) {
        remainingSec = mins * 60;
      }
      endTimeMs = mins > 0 ? Date.now() + remainingSec * 1000 : null;
      lastAudioTime = player.currentTime || 0;

      try {
        await player.play();
        isPlaying = true;
        startBtn.textContent = '⏸ Pause Jaap';
        startBtn.classList.replace('btn-primary', 'btn-danger');
        requestWakeLock();
        updateMediaSessionMeta();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (endTimeMs) {
            remainingSec = Math.max(0, Math.ceil((endTimeMs - Date.now()) / 1000));
            timerDisplayEl.textContent = formatHMS(remainingSec);
            updateMediaSessionMeta();
            if (remainingSec <= 0) {
              stopPlayback(true);
            }
          } else {
            timerDisplayEl.textContent = '∞';
          }
        }, 1000);
      } catch (err) {
        alert('Playback blocked: interact with the page and try again.');
      }
    }

    function stopPlayback(completed = false) {
      player.pause();
      isPlaying = false;
      clearInterval(timerInterval);
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
      wakeStatus.textContent = completed ? 'Session Completed!' : 'Paused';
      startBtn.textContent = '▶ Start Jaap';
      startBtn.classList.replace('btn-danger', 'btn-primary');
      if (completed && navigator.vibrate) {
        navigator.vibrate([300, 150, 300, 150, 500]);
      }
    }

    startBtn.addEventListener('click', () => {
      if (isPlaying) stopPlayback(false);
      else startPlayback();
    });

    resetBtn.addEventListener('click', () => {
      stopPlayback(false);
      sessionCount = 0;
      localStorage.setItem('mj_session', 0);
      player.currentTime = 0;
      lastAudioTime = 0;
      const mins = Number(customMinsInput.value);
      remainingSec = mins * 60;
      timerDisplayEl.textContent = mins > 0 ? formatHMS(remainingSec) : '∞';
      updateCounterUI();
    });

    // --- 8. Init on Load ---
    (async function init() {
      updateCounterUI();
      const savedBlob = await loadAudioBlob();
      if (savedBlob) {
        await attachAudioBlob(savedBlob, 'Saved Mantra Restored');
      }
    })();
  </script>
</body>
</html>
